plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pratiks360.deepwake'
    compileSdk 37

    defaultConfig {
        applicationId "com.pratiks360.deepwake"
        minSdk 26
        targetSdk 33
        versionCode 12
        versionName "0.${versionCode}"
    }

    // A persistent signing key: env vars first (GitHub secrets in CI), else the untracked
    // signing/ folder for local builds - so every APK, CI or local, carries the SAME
    // signature. Without it Gradle falls back to a per-machine throwaway debug keystore
    // and Android refuses to install the APK over the previous one ("App not updated"),
    // forcing an uninstall/reinstall every time.
    def ksFile = System.getenv("DEEPWAKE_KEYSTORE_FILE")
    def ksPass = System.getenv("DEEPWAKE_KEYSTORE_PASSWORD")
    def ksAlias = System.getenv("DEEPWAKE_KEY_ALIAS")
    def ksKeyPass = System.getenv("DEEPWAKE_KEY_PASSWORD")
    if (ksFile == null) {
        def localKs = rootProject.file("signing/deepwake-release.keystore")
        def localInfo = rootProject.file("signing/SIGNING-INFO.txt")
        if (localKs.exists() && localInfo.exists()) {
            def m = localInfo.text =~ /Store password: (\S+)/
            if (m.find()) {
                ksFile = localKs.path
                ksPass = m.group(1)
                ksAlias = "deepwake"
                ksKeyPass = ksPass
            }
        }
    }
    signingConfigs {
        deepwake {
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile != null) signingConfig signingConfigs.deepwake
        }
        debug {
            // Debug builds get the same key so a debug APK from one CI run installs
            // cleanly over the one from the previous run.
            if (ksFile != null) signingConfig signingConfigs.deepwake
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    // Material 3 components + the AppCompat theming they need. Also what makes the app
    // follow the system light/dark setting and Android 12+ wallpaper colours.
    implementation 'com.google.android.material:material:1.12.0'
}

tasks.register("printVersionName") {
    doLast {
        println(android.defaultConfig.versionName)
    }
}
