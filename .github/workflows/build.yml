name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: ver
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionName)
          echo "tag=v${VERSION_NAME}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Decode the persistent signing keystore from the repo secret. A missing secret is a
      # HARD failure: without it Gradle silently falls back to a per-runner throwaway debug
      # keystore, and the published APK can never install over the existing app ("App not
      # updated") - exactly the bug this signing setup exists to prevent.
      - name: Set up signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEEPWAKE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEEPWAKE_KEYSTORE_B64 secret not set - refusing to publish a throwaway-signed APK. Run signing/set-secrets.js (see signing/SIGNING-INFO.txt)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/deepwake.keystore"
          echo "DEEPWAKE_KEYSTORE_FILE=$RUNNER_TEMP/deepwake.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          DEEPWAKE_KEYSTORE_PASSWORD: ${{ secrets.DEEPWAKE_KEYSTORE_PASSWORD }}
          DEEPWAKE_KEY_ALIAS: ${{ secrets.DEEPWAKE_KEY_ALIAS }}
          DEEPWAKE_KEY_PASSWORD: ${{ secrets.DEEPWAKE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Build release APK
        env:
          DEEPWAKE_KEYSTORE_PASSWORD: ${{ secrets.DEEPWAKE_KEYSTORE_PASSWORD }}
          DEEPWAKE_KEY_ALIAS: ${{ secrets.DEEPWAKE_KEY_ALIAS }}
          DEEPWAKE_KEY_PASSWORD: ${{ secrets.DEEPWAKE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Print each APK's signing certificate so a signature drift between builds is
      # visible right in the run log (both digests must match every previous run).
      - name: Verify APK signatures
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk"
            keytool -printcert -jarfile "$apk" | grep -E 'Owner:|SHA256:'
          done

      - name: Rename APKs with version
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/DeepWake-${{ steps.ver.outputs.tag }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/DeepWake-${{ steps.ver.outputs.tag }}-release.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: release-assets/DeepWake-${{ steps.ver.outputs.tag }}-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release-assets/DeepWake-${{ steps.ver.outputs.tag }}-release.apk

      - name: Delete previous releases and tags
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"

          # Releases are a GitHub object, not a git object, so removing them needs
          # the REST API rather than a plain git command.
          for id in $(curl -s -H "Authorization: token $GITHUB_TOKEN" "$api/releases" | jq -r '.[].id'); do
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$api/releases/$id"
          done

          # The underlying tags ARE git objects - delete those with plain git.
          git fetch --tags
          for tag in $(git tag -l 'v*'); do
            git push origin ":refs/tags/$tag" || true
            git tag -d "$tag" || true
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            release-assets/DeepWake-${{ steps.ver.outputs.tag }}-debug.apk
            release-assets/DeepWake-${{ steps.ver.outputs.tag }}-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
